<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>گزارش فروش</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            line-height: 1.6;
            background-color: #f9f9f9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
        }

        th, td {
            border: 1px solid #000;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        h2 {
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>گزارش فروش فروشگاه</h2>

    <table>
        <thead>
            <tr>
                <th>محصول</th>
                <th>فروش</th>
            </tr>
        </thead>
        <tbody>
            {% for item in sales_products %}
            <tr>
                <td>{{ item.store_product__product__product_name }}</td>
                <td>{{ item.total_price }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
