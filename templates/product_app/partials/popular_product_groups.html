{% load static %}
<div class="block block--highlighted block-categories block-categories--layout--compact">
    <div class="container">
        <div class="block-header">
            <h3 class="block-header__title">دسته‌های محبوب</h3>
            <div class="block-header__divider"></div>
            <a class="btn btn-sm btn-secondary" href="{% url 'products:product_groups' %}">مشاهده همه</a>
        </div>
        <div class="block-categories__list">
            {% for group in product_groups %}
                <div class="block-categories__item category-card category-card--layout--compact">
                    <div class="category-card__body">
                        <div class="category-card__image">
                            <a href="{% url 'products:products_by_group' slug=group.slug %}">
                                <img src="{{ media_url }}{{ group.image_name }}" onerror="this.onerror=null;this.src='{% static 'images/no-image.svg' %}'" alt="{{ group.group_title }}">
                            </a>
                        </div>
                        <div class="category-card__content">
                            <div class="category-card__name">
                                <a href="{% url 'products:products_by_group' slug=group.slug %}">{{ group.group_title }}</a>
                            </div>
                            <div class="category-card__products">{{ group.count }} محصول</div>
                        </div>
                    </div>
                </div>
                {% endfor %}
        </div>
    </div>
</div>
