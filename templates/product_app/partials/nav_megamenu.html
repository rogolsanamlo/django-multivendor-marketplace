{% if product_groups %}
    <div class="nav-links__megamenu nav-links__megamenu--size--nl">
        <div class="megamenu">
            <div class="row">
                {% for group in product_groups %}
                    <div class="col-4">
                        <ul class="megamenu__links megamenu__links--level--0">
                            <li class="megamenu__item megamenu__item--with-submenu">
                                <a href="{% url 'products:products_by_group' slug=group.slug %}">{{ group.group_title }}</a>
                                {% if group.groups.all %}
                                    <ul class="megamenu__links megamenu__links--level--1">
                                        {% for sub_group in group.groups.all %}
                                            <li class="megamenu__item">
                                                <a href="{% url 'products:products_by_group' slug=sub_group.slug %}">{{ sub_group.group_title }}</a>
                                            </li>
                                        {% endfor %}
                                    </ul>
                                {% endif %}
                            </li>
                        </ul>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
{% endif %}
